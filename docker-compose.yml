services:
  db:
    image: postgres:16-alpine
    container_name: starterkit-db
    environment:
      POSTGRES_USER: starterkit
      POSTGRES_PASSWORD: starterkit
      POSTGRES_DB: starterkit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starterkit -d starterkit"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: starterkit-api
    environment:
      ENV: development
      PORT: 8080
      DATABASE_URL: postgres://starterkit:starterkit@db:5432/starterkit?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me-in-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: commerce
      MINIO_SECRET_KEY: commerce123
      MINIO_BUCKET: product-images
      MINIO_USE_SSL: "false"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["go", "run", "./cmd/api"]

  minio:
    image: minio/minio:latest
    container_name: commerce-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: commerce
      MINIO_ROOT_PASSWORD: commerce123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
